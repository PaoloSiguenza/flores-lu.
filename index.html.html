<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Lu 💛</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(to top, #fff3b0, #ffe066);
    text-align: center;
}

h1 {
    position: absolute;
    top: 20%;
    width: 100%;
    color: #b8860b;
    font-size: 2.8em;
    opacity: 0;
    animation: aparecer 3s forwards;
}

@keyframes aparecer {
    to { opacity: 1; }
}

.flower {
    position: absolute;
    font-size: 25px;
    animation: caer linear infinite;
}

@keyframes caer {
    0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
    }
}

.bouquet {
    position: absolute;
    bottom: -200px;
    width: 100%;
    font-size: 80px;
    animation: subir 4s ease forwards;
    animation-delay: 2s;
}

@keyframes subir {
    to {
        bottom: 10%;
    }
}
</style>
</head>

<body>

<h1>🌻 Ten tus flores amarillas mi hermosa Lu♥️ 🌻</h1>

<div class="bouquet">💐🌻🌻🌻💐</div>

<audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<script>
function crearFlor() {
    const flor = document.createElement("div");
    flor.classList.add("flower");
    flor.innerHTML = "🌻";

    flor.style.left = Math.random() * window.innerWidth + "px";
    flor.style.animationDuration = (3 + Math.random() * 5) + "s";

    document.body.appendChild(flor);

    setTimeout(() => {
        flor.remove();
    }, 8000);
}

setInterval(crearFlor, 300);
</script>

</body>
</html>
